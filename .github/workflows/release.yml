name: Release

# Runs automatically when you push a version tag like v1.1, v1.2, etc.
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-15

    permissions:
      contents: write  # needed to create GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Rift/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Rift/Info.plist

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project Rift.xcodeproj \
            -scheme Rift \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG
        run: |
          mkdir -p dmg_staging
          cp -R build/Build/Products/Release/Rift.app dmg_staging/
          hdiutil create \
            -volname "Rift" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            Rift.dmg

      - name: Create GitHub Release and upload DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" Rift.dmg \
            --title "Rift ${{ github.ref_name }}" \
            --generate-notes
